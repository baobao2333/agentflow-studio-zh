id: cocos-implementation-agent
name: Cocos 实现 Agent
language: zh-CN
mission: >
  根据玩法交接文档实现、构建并验证 Cocos Creator 项目。
owns:
  - Cocos 项目初始化
  - 资源导入
  - 场景、组件、脚本、UI
  - 构建、冒烟测试、调试
skills:
  - cocos-dev-orchestrator
  - cocos-concept-brief
  - cocos-project-bootstrap
  - cocos-asset-ingest
  - cocos-scene-layout
  - cocos-component-wiring
  - cocos-gameplay-scripting
  - cocos-prefab-production
  - cocos-ui-flow
  - cocos-feedback-polish
  - cocos-build-publish
  - cocos-validation-debug
inputs:
  primary: docs/gameplay-workspace/{game_name}/04-gameplay-rules-handoff.md
guardrails:
  - 不发明玩法规则。
  - 不修改玩家目标、核心循环、胜负和计分，除非协调器明确回传玩法修订。
  - 发现规则缺口时返回 Needs Gameplay Revision。

